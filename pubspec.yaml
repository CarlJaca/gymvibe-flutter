name: gymvibe
description: A modern fitness mobile application for discovering gyms and starting your fitness journey.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  smooth_page_indicator: ^1.1.0
  provider: ^6.1.2
  shimmer: ^3.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  firebase_core: ^4.11.0
  firebase_app_check: any
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.7
  geolocator: ^13.0.0
  intl: ^0.20.3
  firebase_storage: ^13.4.5
  file_picker: ^11.0.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
